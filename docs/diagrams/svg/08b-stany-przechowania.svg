 d="M908.5938,480.127 L908.5938,539.502 L879.9713,545.752 L908.5938,552.002 L908.5938,611.0718 A4.6875,4.6875 0 0 0 913.2813,615.7593 L1272.7264,615.7593 A4.6875,4.6875 0 0 0 1277.4139,611.0718 L1277.4139,491.0645 L1261.7889,475.4395 L913.2813,475.4395 A4.6875,4.6875 0 0 0 908.5938,480.127 " fill="#FFF6E5" style="stroke:#D9601C;stroke-width:0.78125;"/><path d="M1261.7889,475.4395 L1261.7889,488.7207 A2.3438,2.3438 0 0 0 1264.1327,491.0645 L1277.4139,491.0645 L1261.7889,475.4395 " fill="#FFF6E5" style="stroke:#D9601C;stroke-width:0.78125;"/><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="336.0077" x="917.9688" y="503.4851">Stany aktywne (reserved, stored) licza sie</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="314.3005" x="917.9688" y="528.4241">do oblozenia przechowalni i nie moga</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="324.7742" x="917.9688" y="553.363">zachodzic na siebie dla tej samej sztuki.</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="309.6954" x="917.9688" y="578.302">is_overdue = stored i end_date &lt; dzis</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="309.6039" x="917.9688" y="603.241">(wyliczane, nie jest osobnym stanem).</text></g><g id="elem_GMN19"><path d="M492.1875,258.252 L492.1875,292.627 L464.2273,298.877 L492.1875,305.127 L492.1875,339.3188 A4.6875,4.6875 0 0 0 496.875,344.0063 L863.5895,344.0063 A4.6875,4.6875 0 0 0 868.277,339.3188 L868.277,269.1895 L852.652,253.5645 L496.875,253.5645 A4.6875,4.6875 0 0 0 492.1875,258.252 " fill="#FFF6E5" style="stroke:#D9601C;stroke-width:0.78125;"/><path d="M852.652,253.5645 L852.652,266.8457 A2.3438,2.3438 0 0 0 854.9957,269.1895 L868.277,269.1895 L852.652,253.5645 " fill="#FFF6E5" style="stroke:#D9601C;stroke-width:0.78125;"/><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="343.277" x="501.5625" y="281.6101">Linia przerywana: sciezka dostepna w API,</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="323.6664" x="501.5625" y="306.5491">ale nieuzywana przez panel - serwis nie</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="319.5282" x="501.5625" y="331.488">przyjmuje rezerwacji z wyprzedzeniem.</text></g><g id="elem_GMN22"><path d="M326.5625,756.6895 L326.5625,862.6953 A4.6875,4.6875 0 0 0 331.25,867.3828 L742.45,867.3828 A4.6875,4.6875 0 0 0 747.1375,862.6953 L747.1375,816.0645 L774.8039,809.8145 L747.1375,803.5645 L747.1375,767.627 L731.5125,752.002 L331.25,752.002 A4.6875,4.6875 0 0 0 326.5625,756.6895 " fill="#FFF6E5" style="stroke:#D9601C;stroke-width:0.78125;"/><path d="M731.5125,752.002 L731.5125,765.2832 A2.3438,2.3438 0 0 0 733.8562,767.627 L747.1375,767.627 L731.5125,752.002 " fill="#FFF6E5" style="stroke:#D9601C;stroke-width:0.78125;"/><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="362.7502" x="335.9375" y="780.0476">Kazde przejscie realizuje storage/services.py</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="323.1995" x="335.9375" y="804.9866">i zapisuje StorageEvent (log audytowy).</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="341.9861" x="335.9375" y="829.9255">Rozliczenie jest na zleceniu, wiec wydanie</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="387.7625" x="335.9375" y="854.8645">nie sprawdza platnosci. Pobytow sie nie usuwa.</text></g><polygon fill="#444444" points="776.309,479.9801,791.4446,477.1996,782.7574,475.5694,784.3875,466.8822,776.309,479.9801" style="stroke:#444444;stroke-width:1.5625;"/><path d="M7