<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="968.75px" preserveAspectRatio="none" style="width:1289px;height:968px;background:#FFFFFF;" version="1.1" viewBox="0 0 1289 968" width="1289.0625px" zoomAndPan="magnify"><title>Diagram stanow - przechowanie zimowe (StorageBooking)</title><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="25" font-weight="bold" lengthAdjust="spacing" textLength="691.1987" x="292.2913" y="42.6025">Diagram stanow - przechowanie zimowe (StorageBooking)</text><g id="reserved"><rect fill="#F1F1F1" height="131.0059" rx="4.6875" ry="4.6875" style="stroke:#181818;stroke-width:0.78125;" width="454.2694" x="9.375" y="233.252"/><line style="stroke:#181818;stroke-width:0.78125;" x1="9.375" x2="463.6444" y1="298.7549" y2="298.7549"/><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="129.4006" x="171.8094" y="261.2976">Zarezerwowane</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="81.7474" x="195.636" y="286.2366">(reserved)</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="406.2103" x="17.1875" y="326.8005">extend(end_date) [brak kolizji] / zdarzenie extend</text><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="423.0194" x="17.1875" y="351.7395">update_booking(...) [brak kolizji] / zdarzenie update</text></g><g id="stored"><rect fill="#F1F1F1" height="131.0059" rx="4.6875" ry="4.6875" style="stroke:#181818;stroke-width:0.78125;" width="454.2694" x="425" y="480.127"/><line style="stroke:#181818;stroke-width:0.78125;" x1="425" x2="879.2694" y1="545.6299" y2="545.6299"/><text fill="#000000" font-family="Segoe UI" font-size="18.75" lengthAdjust="spacing" textLength="143.6371" x="580.3162" y="508.1726">Na przechowaniu</text><text fill="#000000" font-family="Segoe UI" font-si